name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download PeerJS into the game (so online works without CDN)
        run: |
          curl -fsSL https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js -o www/peerjs.min.js || curl -fsSL https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js -o www/peerjs.min.js
          test -s www/peerjs.min.js
      - name: Install Capacitor
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Patch Android (landscape, fullscreen, keep awake)
        run: python3 scripts/patch_android.py
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ps1-strike-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
