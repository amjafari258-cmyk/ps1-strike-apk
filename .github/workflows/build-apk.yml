name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange web files into www/
        run: |
          mkdir -p www/assets
          [ -f index.html ] && mv index.html www/index.html
          if [ -d assets ]; then cp -r assets/. www/assets/; rm -rf assets; fi
          for f in ./*.gz; do [ -f "$f" ] && mv "$f" www/assets/; done
          [ -f www/index.html ] || { echo "index.html missing"; exit 1; }
          echo "asset files: $(ls www/assets | wc -l)"
          PY=$(find . -name patch_android.py -not -path './node_modules/*' | head -1); echo "$PY" > .pypath
      - name: Download PeerJS into the game (online works without CDN)
        run: |
          curl -fsSL https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js -o www/peerjs.min.js || curl -fsSL https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js -o www/peerjs.min.js
          test -s www/peerjs.min.js
      - run: npm install
      - run: npx cap add android
      - name: Patch Android (landscape, fullscreen, keep awake)
        run: python3 "$(cat .pypath)"
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ps1-strike-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
